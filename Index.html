<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    header  h1 {
      font-size: 24px;
    }

    header p {
      color: #888;
      margin-top: 5px;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      max-width: 800px;
      width: 100%;
      margin: auto;
    }

    .message {
      margin-bottom: 15px;
      padding: 14px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .ai {
      background: #1c1c24;
      margin-right: auto;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
      max-width: 800px;
      width: 100%;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #15151b;
      color: white;
      outline: none;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 My AI Assistant</h1>
    <p>Your personal AI helper</p>
  </header>

  <div id="chat">
